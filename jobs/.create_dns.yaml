stages:
  - dns

dev-create-dns:
  stage: dns
  script:
    - |
      existed=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$cf_zoneid_dev/dns_records?type=CNAME&name=${host}.rpgp.cc" \
                        -H "Authorization: Bearer $cf_token" \
                        -H "Content-Type: application/json" | jq '.result | length')

      if [ "$existed" -eq 0 ]; then
        echo "DNS record does not exist. Creating new DNS record..."
        result=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records" \
                 -H "Authorization: Bearer $cf_token" \
                 -H "Content-Type: application/json" \
                 --data '{"type":"CNAME","name":"'${host}'","content":"'$dns_content_prod'","proxied":true}')
        echo "CreateDnsRecord: ${result}"
      else
        echo "DNS record already exists."
      fi
  only:
  - develop

