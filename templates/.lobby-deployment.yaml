stages:
  - build
  - deploy

variables:
  config: "kubeconfig"

.build:
  stage: build
  variables:
    GIT_STRATEGY: clone
    GIT_SUBMODULE_DEPTH: 1
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_UPDATE_FLAGS: "--remote --checkout --no-single-branch"
    Submodule_Branch: $CI_COMMIT_BRANCH
    # https://docs.gitlab.com/ee/ci/git_submodules.html
  before_script: 
    - | 
      git config --file=.gitmodules submodule.src/components/Wap.branch $Submodule_Branch
      git config --file=.gitmodules submodule.src/components/App/Account.branch $Submodule_Branch
      git config --file=.gitmodules submodule.src/api-services.branch $Submodule_Branch
      git config --file=.gitmodules submodule.src/components/Common.branch $Submodule_Branch
      git submodule sync
      git submodule update --recursive --remote
  script:
    - | 
      node --version
      docker info
      docker login -u $docker_user -p $docker_pwd
      export TAG="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d).$CI_PIPELINE_IID"
      echo "${TAG}" > tag.txt
      docker build -t ${ImageName}:${TAG} .
      docker push ${ImageName}:${TAG}
  artifacts:
    name: npm
    untracked: false
    expire_in: "7 days"
    paths:
      - tag.txt
  tags:
    - local-build
  only:
    - master
    - release/current
    - develop

.deploy-base:
  stage: deploy
  image: 
    name: bitnami/kubectl:1.30
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  before_script:
    - export Components=${!components}
    - Tag=$(cat tag.txt)
    - echo "Tag=$Tag"
  script:
    - | 
      IFS=',' read -r -a components_array <<< "$Components"
      for component in "${components_array[@]}"; do
        echo "Deploying component: $component"
        kubectl set image deployment/$component $component=${ImageName}:${Tag} --record -n $namespace
      done

.deploy-k8s-dev:
  extends: .deploy-base
  variables:
    namespace: dev
  environment:
    name: dev
  tags:
    - dev
  needs:
    - build

.deploy-k8s-staging:
  extends: .deploy-base
  variables:
    namespace: staging
  environment:
    name: staging
  tags:
    - staging
  needs:
    - build
  when: manual

.deploy-k8s-prod:
  extends: .deploy-base
  variables:
    namespace: prod
  environment:
    name: prod
  tags:
    - prod
  needs:
    - build
  when: manual


.notification:
  stage: .post
  script: 
    - printenv
    - |
      curl --location --request POST $Telegram_Bot_Url \
      --header 'Content-Type: application/json' \
      --data-raw "{
          \"chat_id\": $Telegram_Chat_Id,
          \"text\": \"Project: $CI_PROJECT_NAME\nBranch: $CI_COMMIT_BRANCH\nPipeline: $CI_PIPELINE_URL\nCommit: $CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA\nStarted by: $GITLAB_USER_LOGIN\",
          \"parse_mode\": \"HTML\"
      }"
