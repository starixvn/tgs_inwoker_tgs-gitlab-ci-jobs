stages:
  - build
  - deploy
  - undo

variables:
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: normal
  GIT_SUBMODULE_UPDATE_FLAGS: "--remote --checkout --no-single-branch"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  config: "kubeconfig"
  
.build:
  stage: build
  image: pgtgs/tgs-lobby-build:latest
  services:
    - docker:20.10.16-dind
  before_script:
    - docker info
    - docker login -u $docker_user -p $docker_pwd
    - git config --file=.gitmodules submodule.src/components/Wap.branch $CI_COMMIT_BRANCH
    - git config --file=.gitmodules submodule.src/components/App/Account.branch $CI_COMMIT_BRANCH
    - git config --file=.gitmodules submodule.src/api-services.branch $CI_COMMIT_BRANCH
    - git submodule init
    - git submodule update --recursive --remote
  script:
    - export TAG="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d).$CI_PIPELINE_IID"
    - echo "${TAG}" > tag.txt
    - docker build -t ${ImageName}:${TAG} .
    - docker push ${ImageName}:${TAG}
  artifacts:
    name: npm
    untracked: false
    expire_in: "7 days"
    paths:
      - tag.txt

.deploy-base:
  stage: deploy
  before_script:
    - export KUBECONFIG="${config}_${namespace}"
    - export KUBECONFIG=${!KUBECONFIG}
    - export Components=${!components}
  script:
    - | 
      Tag=$(cat tag.txt)
      IFS=',' read -r -a components_array <<< "$Components"

      for component in "${components_array[@]}"; do
        echo "Deploying component: $component"
        kubectl set image deployment/$component $component=${ImageName}:${Tag} --record -n $namespace
      done

notification:
  stage: .post
  script: 
    - printenv
    - |
      curl --location --request POST $Telegram_Bot_Url \
      --header 'Content-Type: application/json' \
      --data-raw "{
          \"chat_id\": $Telegram_Chat_Id,
          \"text\": \"Project: $CI_PROJECT_NAME\nBranch: $CI_COMMIT_BRANCH\nPipeline: $CI_PIPELINE_URL\nCommit: $CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA\nStarted by: $GITLAB_USER_LOGIN\",
          \"parse_mode\": \"HTML\"
      }"
