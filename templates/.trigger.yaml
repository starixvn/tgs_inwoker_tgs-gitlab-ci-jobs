stages:
  - build
.build:
  stage: build
  script:
    - curl -X POST --form "token=$t1_token" --form "ref=$CI_COMMIT_BRANCH" "https://gitlab.com/api/v4/projects/23110099/trigger/pipeline"
    - curl -X POST --form "token=$t2_token" --form "ref=$CI_COMMIT_BRANCH" "https://gitlab.com/api/v4/projects/25406330/trigger/pipeline"
    - curl -X POST --form "token=$t3_token" --form "ref=$CI_COMMIT_BRANCH" "https://gitlab.com/api/v4/projects/27741541/trigger/pipeline"
    - curl -X POST --form "token=$t5_token" --form "ref=$CI_COMMIT_BRANCH" "https://gitlab.com/api/v4/projects/28431316/trigger/pipeline"
    - curl -X POST --form "token=$t8_token" --form "ref=$CI_COMMIT_BRANCH" "https://gitlab.com/api/v4/projects/33534904/trigger/pipeline"
    - curl -X POST --form "token=$t10_token" --form "ref=$CI_COMMIT_BRANCH" "https://gitlab.com/api/v4/projects/36498979/trigger/pipeline"
    - curl -X POST --form "token=$t20_token" --form "ref=$CI_COMMIT_BRANCH" "https://gitlab.com/api/v4/projects/49105169/trigger/pipeline"
  only:
    - master
    - release/current
    - develop
    - dev/369
    - stg/369
    - "369"